name: Fast Development CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags-ignore:
      - '*'
  workflow_dispatch:

jobs:
  test-rust:
    name: Rust Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # TODO: Pin to commit SHA (see .github/ACTION_VERSIONS.md)

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable  # TODO: Pin to commit SHA
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4  # TODO: Pin to commit SHA
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4  # TODO: Pin to commit SHA
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

  test-python:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # pyproject declares requires-python >= 3.8, but GitHub's hosted runners
      # no longer ship 3.8, so 3.9 is the lowest rung tested here. 3.8 does
      # build and pass locally; either lift the floor to 3.9 or accept the gap.
      # fail-fast is off so a break on a new release does not mask the others.
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4  # TODO: Pin to commit SHA (see .github/ACTION_VERSIONS.md)

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable  # TODO: Pin to commit SHA

      - name: Install uv
        uses: astral-sh/setup-uv@v5  # TODO: Pin to commit SHA
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Build extension with maturin
        run: |
          uv run --python ${{ matrix.python-version }} maturin develop --release

      - name: Run Python tests
        run: |
          uv run --python ${{ matrix.python-version }} pytest tests/ -v --tb=short

  lint-python:
    name: Python Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # TODO: Pin to commit SHA (see .github/ACTION_VERSIONS.md)

      - name: Install uv
        uses: astral-sh/setup-uv@v5  # TODO: Pin to commit SHA
        with:
          enable-cache: true

      - name: Install ruff
        run: uv tool install ruff

      - name: Check formatting
        run: uv tool run ruff format --check python/ tests/

      - name: Run linter
        run: uv tool run ruff check python/ tests/

  build-validation:
    name: Build Validation
    needs: [test-rust, test-python, lint-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # TODO: Pin to commit SHA (see .github/ACTION_VERSIONS.md)

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable  # TODO: Pin to commit SHA

      - name: Install uv
        uses: astral-sh/setup-uv@v5  # TODO: Pin to commit SHA
        with:
          enable-cache: true

      - name: Build wheel
        run: |
          uv run maturin build --release

      - name: Build sdist
        run: |
          uv run maturin sdist

      - name: List built artifacts
        run: |
          ls -lh target/wheels/
          ls -lh target/wheels/*.whl target/wheels/*.tar.gz || true
